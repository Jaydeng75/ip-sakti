services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ipsakti
      POSTGRES_USER: ipsakti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti -d ipsakti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      IPSAKTI_ENVIRONMENT: development
      IPSAKTI_SECRET_KEY: ${IPSAKTI_SECRET_KEY:-local-development-secret-key-change-before-deploy}
      IPSAKTI_DATABASE_URL: postgresql+psycopg://ipsakti:${POSTGRES_PASSWORD:-local-dev-only-change-me}@db:5432/ipsakti
      IPSAKTI_ALLOWED_ORIGINS: http://localhost:3000
      IPSAKTI_PUBLIC_API_URL: http://localhost:8000
      IPSAKTI_DEMO_MODE: "true"
      IPSAKTI_REGISTRATION_ENABLED: "true"
      IPSAKTI_TRANSLATION_ENABLED: "true"
      IPSAKTI_TRANSLATION_URL: http://translation:8100
      IPSAKTI_TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-}
      IPSAKTI_TRANSLATION_TIMEOUT_SECONDS: "180"
      IPSAKTI_EMBEDDING_PROVIDER: ${IPSAKTI_EMBEDDING_PROVIDER:-deterministic}
      IPSAKTI_EMBEDDING_URL: ${IPSAKTI_EMBEDDING_URL:-http://host.docker.internal:8081/v1}
      IPSAKTI_EMBEDDING_API_KEY: ${IPSAKTI_EMBEDDING_API_KEY:-}
      IPSAKTI_EMBEDDING_MODEL: ${IPSAKTI_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      IPSAKTI_EMBEDDING_REVISION: ${IPSAKTI_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      IPSAKTI_EMBEDDING_DIMENSIONS: ${IPSAKTI_EMBEDDING_DIMENSIONS:-384}
      IPSAKTI_EMBEDDING_ALLOW_FALLBACK: ${IPSAKTI_EMBEDDING_ALLOW_FALLBACK:-true}
      IPSAKTI_RETRIEVAL_PREFETCH_LIMIT: ${IPSAKTI_RETRIEVAL_PREFETCH_LIMIT:-40}
      IPSAKTI_RETRIEVAL_MINIMUM_LEXICAL_SCORE: ${IPSAKTI_RETRIEVAL_MINIMUM_LEXICAL_SCORE:-0.05}
      IPSAKTI_RETRIEVAL_MINIMUM_RERANK_SCORE: ${IPSAKTI_RETRIEVAL_MINIMUM_RERANK_SCORE:-0.05}
      IPSAKTI_RERANKER_PROVIDER: ${IPSAKTI_RERANKER_PROVIDER:-heuristic}
      IPSAKTI_RERANKER_URL: ${IPSAKTI_RERANKER_URL:-}
      IPSAKTI_RERANKER_API_KEY: ${IPSAKTI_RERANKER_API_KEY:-}
      IPSAKTI_RERANKER_MODEL: ${IPSAKTI_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      IPSAKTI_RERANKER_REVISION: ${IPSAKTI_RERANKER_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      IPSAKTI_RERANKER_ALLOW_FALLBACK: ${IPSAKTI_RERANKER_ALLOW_FALLBACK:-true}
      IPSAKTI_EXTERNAL_RESEARCH_ENABLED: ${IPSAKTI_EXTERNAL_RESEARCH_ENABLED:-true}
      IPSAKTI_EXTERNAL_RESEARCH_TIMEOUT_SECONDS: ${IPSAKTI_EXTERNAL_RESEARCH_TIMEOUT_SECONDS:-20}
      IPSAKTI_EXTERNAL_RESEARCH_MAX_RESULTS: ${IPSAKTI_EXTERNAL_RESEARCH_MAX_RESULTS:-5}
      IPSAKTI_NCBI_API_KEY: ${IPSAKTI_NCBI_API_KEY:-}
      IPSAKTI_NCBI_CONTACT_EMAIL: ${IPSAKTI_NCBI_CONTACT_EMAIL:-}
      IPSAKTI_PATENT_SEARCH_PROVIDER: ${IPSAKTI_PATENT_SEARCH_PROVIDER:-auto}
      IPSAKTI_GOOGLE_CLOUD_PROJECT: ${IPSAKTI_GOOGLE_CLOUD_PROJECT:-}
      IPSAKTI_BIGQUERY_LOCATION: ${IPSAKTI_BIGQUERY_LOCATION:-US}
      IPSAKTI_BIGQUERY_MAXIMUM_BYTES_BILLED: ${IPSAKTI_BIGQUERY_MAXIMUM_BYTES_BILLED:-100000000000}
      IPSAKTI_EPO_OPS_CONSUMER_KEY: ${IPSAKTI_EPO_OPS_CONSUMER_KEY:-}
      IPSAKTI_EPO_OPS_CONSUMER_SECRET: ${IPSAKTI_EPO_OPS_CONSUMER_SECRET:-}
      IPSAKTI_OTEL_ENABLED: ${IPSAKTI_OTEL_ENABLED:-false}
      IPSAKTI_OTEL_EXPORTER_ENDPOINT: ${IPSAKTI_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      translation:
        condition: service_healthy
    volumes:
      - evidence_uploads:/app/data/uploads

  translation:
    build: ./translation-service
    environment:
      INDICTRANS_HF_TOKEN: ${HF_TOKEN:-}
      INDICTRANS_EN_INDIC_MODEL: ai4bharat/indictrans2-en-indic-dist-200M
      INDICTRANS_INDIC_EN_MODEL: ai4bharat/indictrans2-indic-en-dist-200M
      INDICTRANS_EN_INDIC_REVISION: ${INDICTRANS_EN_INDIC_REVISION:-173b94239f7c38886b2747b8d4a5db771a7e1232}
      INDICTRANS_INDIC_EN_REVISION: ${INDICTRANS_INDIC_EN_REVISION:-eb9e49d81077cfc5311e82ff36d8c1fc11557b5d}
      INDICTRANS_MAX_LOADED_MODELS: "2"
      INDICTRANS_PRELOAD_MODELS: ${INDICTRANS_PRELOAD_MODELS:-false}
      INDICTRANS_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:-}
      INDICTRANS_GENERATION_BEAMS: ${INDICTRANS_GENERATION_BEAMS:-1}
    ports:
      - "8100:8100"
    volumes:
      - indictrans_models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_DEMO_AUTH: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  retrieval:
    profiles: ["neural"]
    build: ./retrieval-service
    environment:
      RETRIEVAL_HF_TOKEN: ${HF_TOKEN:-}
      RETRIEVAL_SERVICE_TOKEN: ${RETRIEVAL_SERVICE_TOKEN:-}
      RETRIEVAL_EMBEDDING_MODEL: ${RETRIEVAL_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      RETRIEVAL_EMBEDDING_REVISION: ${RETRIEVAL_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      RETRIEVAL_RERANKER_MODEL: ${RETRIEVAL_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RETRIEVAL_RERANKER_REVISION: ${RETRIEVAL_RERANKER_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      RETRIEVAL_PRELOAD_MODELS: ${RETRIEVAL_PRELOAD_MODELS:-false}
      RETRIEVAL_REQUIRE_PINNED_REVISIONS: ${RETRIEVAL_REQUIRE_PINNED_REVISIONS:-true}
    ports:
      - "8200:8200"
    volumes:
      - retrieval_models:/models/huggingface

volumes:
  postgres_data:
  evidence_uploads:
  indictrans_models:
  retrieval_models:
