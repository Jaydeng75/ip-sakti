services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    restart: unless-stopped

  backend:
    environment:
      IPSAKTI_ENVIRONMENT: production
      IPSAKTI_SECRET_KEY: ${IPSAKTI_SECRET_KEY:?Set IPSAKTI_SECRET_KEY}
      IPSAKTI_DATABASE_URL: ${IPSAKTI_DATABASE_URL:?Set a TLS-enabled managed PostgreSQL URL}
      IPSAKTI_ALLOWED_ORIGINS: ${IPSAKTI_ALLOWED_ORIGINS:?Set the exact frontend origin}
      IPSAKTI_PUBLIC_API_URL: ${IPSAKTI_PUBLIC_API_URL:?Set the public API URL}
      IPSAKTI_TRUSTED_HOSTS: ${IPSAKTI_TRUSTED_HOSTS:?Set expected API hosts}
      IPSAKTI_DEMO_MODE: "false"
      IPSAKTI_REGISTRATION_ENABLED: "false"
      IPSAKTI_TRANSLATION_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:?Set TRANSLATION_SERVICE_TOKEN}
      IPSAKTI_MALWARE_SCAN_ENABLED: "true"
      IPSAKTI_CLAMAV_HOST: ${IPSAKTI_CLAMAV_HOST:?Set the approved ClamAV host}
      IPSAKTI_CLAMAV_PORT: ${IPSAKTI_CLAMAV_PORT:-3310}
      IPSAKTI_BOOTSTRAP_ADMIN_EMAIL: ${IPSAKTI_BOOTSTRAP_ADMIN_EMAIL:-}
      IPSAKTI_BOOTSTRAP_ADMIN_PASSWORD: ${IPSAKTI_BOOTSTRAP_ADMIN_PASSWORD:-}
      IPSAKTI_EMBEDDING_PROVIDER: "http"
      IPSAKTI_EMBEDDING_URL: ${IPSAKTI_EMBEDDING_URL:?Set the approved OpenAI-compatible embedding endpoint}
      IPSAKTI_EMBEDDING_API_KEY: ${IPSAKTI_EMBEDDING_API_KEY:?Set the embedding service credential}
      IPSAKTI_EMBEDDING_MODEL: ${IPSAKTI_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      IPSAKTI_EMBEDDING_REVISION: ${IPSAKTI_EMBEDDING_REVISION:?Pin the reviewed embedding model revision}
      IPSAKTI_EMBEDDING_DIMENSIONS: ${IPSAKTI_EMBEDDING_DIMENSIONS:-384}
      IPSAKTI_EMBEDDING_ALLOW_FALLBACK: "false"
      IPSAKTI_RETRIEVAL_PREFETCH_LIMIT: ${IPSAKTI_RETRIEVAL_PREFETCH_LIMIT:-50}
      IPSAKTI_RETRIEVAL_MINIMUM_LEXICAL_SCORE: ${IPSAKTI_RETRIEVAL_MINIMUM_LEXICAL_SCORE:-0.05}
      IPSAKTI_RETRIEVAL_MINIMUM_RERANK_SCORE: ${IPSAKTI_RETRIEVAL_MINIMUM_RERANK_SCORE:-0.05}
      IPSAKTI_RERANKER_PROVIDER: "http"
      IPSAKTI_RERANKER_URL: ${IPSAKTI_RERANKER_URL:?Set the approved reranker endpoint}
      IPSAKTI_RERANKER_API_KEY: ${IPSAKTI_RERANKER_API_KEY:?Set the reranker credential}
      IPSAKTI_RERANKER_MODEL: ${IPSAKTI_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      IPSAKTI_RERANKER_REVISION: ${IPSAKTI_RERANKER_REVISION:?Pin the reviewed reranker revision}
      IPSAKTI_EXTERNAL_RESEARCH_ENABLED: "true"
      IPSAKTI_NCBI_API_KEY: ${IPSAKTI_NCBI_API_KEY:-}
      IPSAKTI_NCBI_CONTACT_EMAIL: ${IPSAKTI_NCBI_CONTACT_EMAIL:?Set the registered NCBI contact email}
      IPSAKTI_EPO_OPS_CONSUMER_KEY: ${IPSAKTI_EPO_OPS_CONSUMER_KEY:?Set the EPO OPS consumer key}
      IPSAKTI_EPO_OPS_CONSUMER_SECRET: ${IPSAKTI_EPO_OPS_CONSUMER_SECRET:?Set the EPO OPS consumer secret}
      IPSAKTI_OTEL_ENABLED: "true"
      IPSAKTI_OTEL_SERVICE_NAME: ${IPSAKTI_OTEL_SERVICE_NAME:-ip-sakti-api}
      IPSAKTI_OTEL_EXPORTER_ENDPOINT: ${IPSAKTI_OTEL_EXPORTER_ENDPOINT:?Set the approved OTLP HTTP traces endpoint}
    restart: unless-stopped

  translation:
    environment:
      INDICTRANS_SERVICE_TOKEN: ${TRANSLATION_SERVICE_TOKEN:?Set TRANSLATION_SERVICE_TOKEN}
      INDICTRANS_PRELOAD_MODELS: "true"
    ports: !reset []
    restart: unless-stopped

  retrieval:
    environment:
      RETRIEVAL_HF_TOKEN: ${HF_TOKEN:-}
      RETRIEVAL_SERVICE_TOKEN: ${RETRIEVAL_SERVICE_TOKEN:?Set RETRIEVAL_SERVICE_TOKEN}
      RETRIEVAL_EMBEDDING_REVISION: ${RETRIEVAL_EMBEDDING_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
      RETRIEVAL_RERANKER_REVISION: ${RETRIEVAL_RERANKER_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      RETRIEVAL_PRELOAD_MODELS: "true"
      RETRIEVAL_REQUIRE_PINNED_REVISIONS: "true"
    ports: !reset []
    restart: unless-stopped

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public API URL ending in /api/v1}
        NEXT_PUBLIC_DEMO_AUTH: "false"
    restart: unless-stopped
